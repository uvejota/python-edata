name: Publish to PyPI

on:
  workflow_run:
    workflows: ["Test and lint"]  # nombre exacto del workflow de tests
    types:
      - completed

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine requests

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version exists on PyPI
        id: check_pypi
        run: |
          PKG_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'].replace('_','-'))")
          VERSION=${{ steps.get_version.outputs.version }}
          STATUS=$(python -c "import requests,sys; r=requests.get(f'https://pypi.org/pypi/{PKG_NAME}/{VERSION}/json'); sys.exit(0 if r.status_code==404 else 1)")
        continue-on-error: true

      - name: Build package
        if: steps.check_pypi.outcome == 'success'
        run: python -m build

      - name: Publish to PyPI
        if: steps.check_pypi.outcome == 'success'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*